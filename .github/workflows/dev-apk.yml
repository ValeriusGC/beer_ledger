name: Dev APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --flavor dev
      - name: Rename APK with run number
        run: |
          mv build/app/outputs/flutter-apk/app-dev-release.apk \
            "build/app/outputs/flutter-apk/beer-ledger-dev-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: beer-ledger-dev-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/beer-ledger-dev-${{ github.run_number }}.apk
