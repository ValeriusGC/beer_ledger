# Static analysis для Flutter app (beer_ledger).
#
# CI: flutter analyze --fatal-warnings lib (см. docs/ci.md).
# Core-пакет — свой analysis_options.yaml в packages/beer_ledger_core/.

include: package:flutter_lints/flutter.yaml

# analysis_server_plugin; версия = flutter_riverpod в pubspec.lock (3.3.2 → 3.1.4).
# https://pub.dev/packages/riverpod_lint
plugins:
  riverpod_lint: 3.1.4

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**
    - windows/**
  errors:
    # @riverpod / @freezed — цель аннотации не всегда совпадает с Dart-элементом.
    invalid_annotation_target: ignore

linter:
  rules:
    # Дополнительные правила — по мере осознанной миграции, не «всё сразу».
